<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>{{TITLE}} - 360° Experience</title>
  <meta name="description" content="Interactive 360 video experience. No apps required.">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }
    #video {
      display: none;
    }
    /* Overlay HUD */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 0.3s ease;
    }
    .overlay.hidden {
      opacity: 0;
    }
    .header {
      padding: 20px 24px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
    }
    .title-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge-360 {
      background: linear-gradient(135deg, #0070f3, #00dfd8);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(0, 223, 216, 0.3);
    }
    .title-text {
      font-size: 18px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .hint-banner {
      align-self: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      animation: pulse 2.5s infinite;
      pointer-events: none;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    .controls-bar {
      padding: 20px 24px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #0070f3, #00dfd8);
      border-radius: 3px;
      width: 0%;
      position: relative;
    }
    .progress-bar::after {
      content: '';
      position: absolute;
      right: -6px;
      top: -4px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .control-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      transition: all 0.2s ease;
      border-radius: 50%;
    }
    .control-btn:hover {
      opacity: 1;
      transform: scale(1.1);
      background: rgba(255,255,255,0.15);
    }
    .control-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }
    .time-display {
      font-size: 13px;
      color: #ccc;
      font-variant-numeric: tabular-nums;
    }
    /* Big Play Button on Start */
    #bigPlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      background: rgba(0, 112, 243, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 112, 243, 0.6);
      border: 2px solid rgba(255,255,255,0.4);
      z-index: 10;
      transition: transform 0.2s ease;
      pointer-events: auto;
    }
    #bigPlay:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }
    #bigPlay svg {
      width: 36px;
      height: 36px;
      fill: #fff;
      margin-left: 4px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="container"></div>

  <!-- Video Element (plays inline for iOS Safari & Android Chrome) -->
  <video id="video" playsinline webkit-playsinline loop preload="auto">
    <source src="{{VIDEO_SRC}}" type="video/mp4">
  </video>

  <div id="bigPlay" title="Start 360 Video">
    <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
  </div>

  <div class="overlay" id="overlay">
    <div class="header">
      <div class="title-badge">
        <span class="badge-360">360° VIEW</span>
        <span class="title-text">{{TITLE}}</span>
      </div>
      <div>
        <button class="control-btn" id="gyroBtn" title="Toggle Motion / Gyroscope">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm6.31-3.1L7.1 5.69C8.45 4.63 10.15 4 12 4c4.41 0 8 3.59 8 8 0 1.85-.63 3.55-1.69 4.9z"/></svg>
        </button>
      </div>
    </div>

    <div class="hint-banner" id="hintBanner">
      👆 Drag to rotate 360° &bull; 📱 Turn phone to look around
    </div>

    <div class="controls-bar">
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="buttons-row">
        <div class="btn-group">
          <button class="control-btn" id="playPauseBtn" title="Play / Pause">
            <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button class="control-btn" id="muteBtn" title="Mute / Unmute">
            <svg id="volumeIcon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            <svg id="muteIcon" viewBox="0 0 24 24" style="display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          </button>
          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        </div>
        <div class="btn-group">
          <button class="control-btn" id="fullscreenBtn" title="Full Screen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    const video = document.getElementById('video');
    const bigPlay = document.getElementById('bigPlay');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const muteBtn = document.getElementById('muteBtn');
    const volumeIcon = document.getElementById('volumeIcon');
    const muteIcon = document.getElementById('muteIcon');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const gyroBtn = document.getElementById('gyroBtn');
    const hintBanner = document.getElementById('hintBanner');

    // 1. Scene, Camera, Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.target = new THREE.Vector3(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // 2. 360 Inverted Sphere Geometry
    const geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1); // Invert sphere so video is projected inward

    const texture = new THREE.VideoTexture(video);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.format = THREE.RGBFormat;

    const material = new THREE.MeshBasicMaterial({ map: texture });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // 3. User Interaction (Mouse & Touch Drag)
    let isUserInteracting = false;
    let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
    let lon = 0, onPointerDownLon = 0;
    let lat = 0, onPointerDownLat = 0;
    let phi = 0, theta = 0;
    let gyroEnabled = false;

    function onPointerDown(e) {
      isUserInteracting = true;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      onPointerDownPointerX = clientX;
      onPointerDownPointerY = clientY;
      onPointerDownLon = lon;
      onPointerDownLat = lat;
      hintBanner.style.opacity = '0';
    }

    function onPointerMove(e) {
      if (!isUserInteracting) return;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      lon = (onPointerDownPointerX - clientX) * 0.15 + onPointerDownLon;
      lat = (clientY - onPointerDownPointerY) * 0.15 + onPointerDownLat;
    }

    function onPointerUp() {
      isUserInteracting = false;
    }

    container.addEventListener('pointerdown', onPointerDown);
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);

    // Zoom (Pinch or Wheel)
    container.addEventListener('wheel', (e) => {
      const fov = camera.fov + e.deltaY * 0.05;
      camera.fov = THREE.MathUtils.clamp(fov, 30, 95);
      camera.updateProjectionMatrix();
    });

    // 4. Mobile Gyroscope / Device Orientation
    function requestGyro() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              enableDeviceOrientation();
            }
          })
          .catch(console.error);
      } else {
        enableDeviceOrientation();
      }
    }

    function enableDeviceOrientation() {
      gyroEnabled = !gyroEnabled;
      if (gyroEnabled) {
        gyroBtn.style.color = '#00dfd8';
        window.addEventListener('deviceorientation', handleOrientation);
      } else {
        gyroBtn.style.color = '#fff';
        window.removeEventListener('deviceorientation', handleOrientation);
      }
    }

    function handleOrientation(event) {
      if (!gyroEnabled || !event.alpha) return;
      // Map orientation angles to spherical coords
      lon = -event.alpha;
      lat = event.beta - 90;
    }

    gyroBtn.addEventListener('click', requestGyro);

    // 5. Playback Controls
    function togglePlay() {
      if (video.paused) {
        video.play().then(() => {
          bigPlay.style.display = 'none';
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        }).catch(err => {
          console.warn("Autoplay blocked:", err);
        });
      } else {
        video.pause();
        bigPlay.style.display = 'flex';
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    bigPlay.addEventListener('click', togglePlay);
    playPauseBtn.addEventListener('click', togglePlay);

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      volumeIcon.style.display = video.muted ? 'none' : 'block';
      muteIcon.style.display = video.muted ? 'block' : 'none';
    });

    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        progressBar.style.width = pct + '%';
        timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }
    });

    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      video.currentTime = pos * video.duration;
    });

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      update();
    }

    function update() {
      lat = Math.max(-85, Math.min(85, lat));
      phi = THREE.MathUtils.degToRad(90 - lat);
      theta = THREE.MathUtils.degToRad(lon);

      camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
      camera.target.y = 500 * Math.cos(phi);
      camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);

      camera.lookAt(camera.target);
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
